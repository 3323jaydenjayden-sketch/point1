<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的習慣養成集點卡</title>
    <!-- 引入 Google Fonts 溫暖字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FFFDF9;
            --card-bg: #FFFFFF;
            --primary-color: #FF8C42;
            --primary-hover: #E07532;
            --accent-color: #FFD166;
            --text-color: #4A4A4A;
            --text-light: #888888;
            --border-color: #F3EFEA;
            --grid-bg: #FAF6F0;
            --grid-stamped: #FFF3EB;
            --shadow: 0 10px 25px rgba(255, 140, 66, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans TC', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #D66826;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-light);
            font-size: 0.95rem;
        }

        /* 狀態卡片 */
        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            border: 2px solid var(--border-color);
            margin-bottom: 25px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px dashed var(--border-color);
        }

        .stat-item h3 {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .stat-item .value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--primary-color);
        }

        /* 增加點數表單 */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background-color: #FAFAFA;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background-color: #FFFFFF;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background-color: var(--primary-color);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* 集點格子區 */
        .stamp-section-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stamp-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stamp-cell {
            aspect-ratio: 1;
            background-color: var(--grid-bg);
            border: 2px dashed #E5DCD0;
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: #CCC;
            position: relative;
            transition: all 0.3s ease;
        }

        .stamp-cell.stamped {
            background-color: var(--grid-stamped);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            font-weight: 700;
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(255, 140, 66, 0.15);
        }

        .stamp-cell .stamp-icon {
            font-size: 1.5rem;
            margin-bottom: 2px;
        }

        /* 歷史紀錄 */
        .history-section h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .history-list {
            max-height: 220px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            background-color: #FAFAFA;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .history-info .reason {
            font-weight: 500;
            color: var(--text-color);
        }

        .history-info .time {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 2px;
        }

        .history-points {
            font-weight: 700;
            color: var(--primary-color);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 253, 249, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 700;
            z-index: 999;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-overlay">連線雲端資料庫中...</div>

    <div class="container">
        <header>
            <h1>🌟 我的習慣養成集點卡</h1>
            <p>累積好習慣，每天給自己一點鼓勵！</p>
        </header>

        <!-- 數據與增加點數面板 -->
        <div class="card">
            <div class="stats-row">
                <div class="stat-item">
                    <h3>目前總點數</h3>
                    <div class="value" id="totalPoints">0</div>
                </div>
                <div class="stat-item">
                    <h3>本輪進度</h3>
                    <div class="value" id="roundProgress">0 / 10</div>
                </div>
            </div>

            <form id="addPointForm">
                <div class="form-group">
                    <label for="reasonInput">達成事項 / 習慣紀錄</label>
                    <input type="text" id="reasonInput" class="form-control" placeholder="例如：認真練琴 30 分鐘" required>
                </div>
                <div class="form-group">
                    <label for="pointsInput">增加點數</label>
                    <input type="number" id="pointsInput" class="form-control" value="1" min="1" max="10" required>
                </div>
                <button type="submit" class="btn">✨ 增加點數與蓋章</button>
            </form>
        </div>

        <!-- 10格集點卡視覺 -->
        <div class="card">
            <div class="stamp-section-title">
                <span>🎯 本輪集點卡 (每滿 10 點為一輪)</span>
                <span id="currentRoundBadge" style="font-size: 0.85rem; color: var(--text-light);">第 1 輪</span>
            </div>
            <div class="stamp-grid" id="stampGrid">
                <!-- 動態生成 10 格 -->
            </div>
        </div>

        <!-- 歷史紀錄 -->
        <div class="card history-section">
            <h3>📜 點數變更紀錄</h3>
            <div class="history-list" id="historyList">
                <div style="text-align: center; color: var(--text-light); padding: 15px;">暫無紀錄</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK 模組與邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, arrayUnion, onSnapshot } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAc8vE2_lC2XVtL_kl9wXV3MEQXvNge3K0",
            authDomain: "point-95fde.firebaseapp.com",
            projectId: "point-95fde",
            storageBucket: "point-95fde.firebasestorage.app",
            messagingSenderId: "579889141483",
            appId: "1:579889141483:web:6655def7b5d2e0a85f10ae",
            measurementId: "G-57T2G8HKLW"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 指定 Firestore 資料庫路徑：habits 集合 -> my_card 文件
        const docRef = doc(db, "habits", "my_card");

        const totalPointsEl = document.getElementById("totalPoints");
        const roundProgressEl = document.getElementById("roundProgress");
        const currentRoundBadgeEl = document.getElementById("currentRoundBadge");
        const stampGridEl = document.getElementById("stampGrid");
        const historyListEl = document.getElementById("historyList");
        const addPointForm = document.getElementById("addPointForm");
        const reasonInput = document.getElementById("reasonInput");
        const pointsInput = document.getElementById("pointsInput");
        const loadingEl = document.getElementById("loading");

        const GRID_SIZE = 10;

        // 渲染 10 個印章格子
        function renderStampGrid(currentPoints) {
            stampGridEl.innerHTML = "";
            const remainder = currentPoints % GRID_SIZE;
            const currentRound = Math.floor(currentPoints / GRID_SIZE) + 1;
            
            currentRoundBadgeEl.textContent = `第 ${currentRound} 輪`;

            for (let i = 1; i <= GRID_SIZE; i++) {
                const cell = document.createElement("div");
                cell.className = "stamp-cell";
                
                if (i <= remainder || (currentPoints > 0 && remainder === 0)) {
                    cell.classList.add("stamped");
                    cell.innerHTML = `<span class="stamp-icon">💮</span><span>${i}</span>`;
                } else {
                    cell.innerHTML = `<span>${i}</span>`;
                }
                stampGridEl.appendChild(cell);
            }
        }

        // 渲染歷史紀錄
        function renderHistory(historyArray) {
            if (!historyArray || historyArray.length === 0) {
                historyListEl.innerHTML = `<div style="text-align: center; color: var(--text-light); padding: 15px;">暫無紀錄</div>`;
                return;
            }

            historyListEl.innerHTML = "";
            const sortedHistory = [...historyArray].reverse();

            sortedHistory.forEach(item => {
                const div = document.createElement("div");
                div.className = "history-item";
                div.innerHTML = `
                    <div class="history-info">
                        <div class="reason">${escapeHtml(item.reason)}</div>
                        <div class="time">${item.time}</div>
                    </div>
                    <div class="history-points">+${item.points} 點</div>
                `;
                historyListEl.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        // 即時監聽資料庫變更
        onSnapshot(docRef, async (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                const points = data.totalPoints || 0;
                const history = data.history || [];

                totalPointsEl.textContent = points;
                roundProgressEl.textContent = `${points % GRID_SIZE} / ${GRID_SIZE}`;
                renderStampGrid(points);
                renderHistory(history);
            } else {
                // 若文件不存在，自動在雲端建立預設初始文件
                await setDoc(docRef, {
                    totalPoints: 0,
                    history: []
                }, { merge: true });
            }
            loadingEl.style.opacity = "0";
            setTimeout(() => loadingEl.style.display = "none", 300);
        }, (error) => {
            console.error("Firebase 連線錯誤: ", error);
            loadingEl.textContent = "連線失敗，請確認 Firebase 安全規則設為允許讀寫。";
        });

        // 按下新增點數時自動建立/更新 Firebase
        addPointForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const reason = reasonInput.value.trim();
            const addPoints = parseInt(pointsInput.value);

            if (!reason || isNaN(addPoints) || addPoints <= 0) return;

            const now = new Date();
            const timeStr = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, '0')}/${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            try {
                // 讀取當前資料
                const docSnap = await getDoc(docRef);
                const currentData = docSnap.exists() ? docSnap.data() : { totalPoints: 0, history: [] };
                const newTotal = (currentData.totalPoints || 0) + addPoints;

                const newRecord = {
                    reason: reason,
                    points: addPoints,
                    time: timeStr
                };

                // 使用 setDoc + merge: true，自動建立或覆蓋更新
                await setDoc(docRef, {
                    totalPoints: newTotal,
                    history: arrayUnion(newRecord)
                }, { merge: true });

                reasonInput.value = "";
                pointsInput.value = "1";
            } catch (err) {
                console.error("更新點數失敗: ", err);
                alert("寫入失敗，請檢查 Firebase Console 規則設定！");
            }
        });
    </script>
</body>
</html>
